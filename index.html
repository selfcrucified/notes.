<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141414"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>NOTES</title><style>
*{box-sizing:border-box}body{margin:0;background:#141414;color:#eee;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:680px;margin:auto;padding: max(24px,env(safe-area-inset-top)) 20px 110px}h1{font-size:34px;letter-spacing:-2px;margin:12px 0 24px}button,input,textarea,select{font:inherit;color:inherit;background:#242424;border:1px solid #363636;border-radius:12px;padding:12px}button{cursor:pointer}button:active{background:#444}input,textarea{width:100%}textarea{min-height:230px;resize:vertical;line-height:1.6}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;background:#1b1b1b;padding:12px 8px max(12px,env(safe-area-inset-bottom));border-top:1px solid #333}nav button{border:0;background:none;font-size:13px}nav button.active{background:#363636} .row{display:flex;gap:8px;align-items:center;margin:10px 0}.row>*{min-width:0}.grow{flex:1}.item{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid #303030}.item button{background:none;border:0;padding:8px}.item .grow{cursor:pointer;overflow-wrap:anywhere}.muted{color:#999;font-size:13px}.section{margin:26px 0 10px;color:#999;font-size:12px;letter-spacing:2px}.task{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #303030;align-items:flex-start}.task input{width:22px;height:22px;accent-color:#aaa}.task div{white-space:pre-wrap;overflow-wrap:anywhere}.done{text-decoration:line-through;color:#777}.primary{background:#ddd;color:#111;border:0}#status{color:#aaa;font-size:13px;min-height:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere} </style><main><h1>NOTES<span style="color:#777">.</span></h1><div id="view"></div><div id="status"></div></main><nav id="nav"></nav><script>
const $=s=>document.querySelector(s), key='notes-v01';let db;try{db=JSON.parse(localStorage.getItem(key))}catch{};db=db||{notes:[],folders:[],tasks:[],trips:[],received:[]};let page='home',folder=null,editing=null;const uid=()=>crypto.randomUUID?.()||Date.now()+'-'+Math.random();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(key,JSON.stringify(db));$('#status').textContent='Сохранено локально'}catch(e){$('#status').textContent='Ошибка сохранения: '+e.message}}function go(p){page=p;editing=null;folder=null;render()}function addTask(){let t=$('#quick').value.trim();if(!t)return;db.tasks.unshift({id:uid(),text:t,date:new Date().toISOString(),done:false});save();render()}function toggle(i){db.tasks[i].done=!db.tasks[i].done;save();render()}function tasks(){return db.tasks.map((t,i)=>`<div class="task"><input type="checkbox" ${t.done?'checked':''} onchange="toggle(${i})"><div class="grow ${t.done?'done':''}">${esc(t.text)}<div class="muted">${new Date(t.date).toLocaleString('ru')}</div></div><button onclick="if(confirm('Удалить запись?')){db.tasks.splice(${i},1);save();render()}">×</button></div>`).join('')||'<p class="muted">Пока пусто</p>'}function noteRow(n){return `<div class="item"><span>▤</span><div class="grow" onclick="openNote('${n.id}')">${esc(n.title||'Без названия')}</div><button onclick="pin('${n.id}')">${n.pin?'★':'☆'}</button></div>`}function pin(id){let n=db.notes.find(n=>n.id===id)||db.folders.find(n=>n.id===id);n.pin=!n.pin;save();render()}function folderRow(f){return `<div class="item"><span>▱</span><div class="grow" onclick="openFolder('${f.id}')">${esc(f.title)}</div><button onclick="pin('${f.id}')">${f.pin?'★':'☆'}</button></div>`}function openFolder(id){page='files';folder=id;editing=null;render()}function newFolder(){let title=prompt('Название папки');if(title?.trim()){db.folders.push({id:uid(),title:title.trim(),parent:folder,pin:false});save();render()}}function newNote(){let n={id:uid(),title:'',body:'',parent:folder,pin:false};db.notes.push(n);save();openNote(n.id)}function openNote(id){editing=id;render()}function updateNote(){let n=db.notes.find(n=>n.id===editing);n.title=$('#nt').value;n.body=$('#nb').value;save()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='notes-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(f){try{let d=JSON.parse(await f.text());if(!['notes','folders','tasks','trips','received'].every(k=>Array.isArray(d[k])))throw Error('Неверный формат');if(confirm('Заменить текущие данные резервной копией?')){db=d;save();go('home')}}catch(e){alert(e.message)}}function receive(d){if(d.type==='task'&&typeof d.text==='string'){db.tasks.unshift({id:uid(),text:d.text,date:new Date().toISOString(),done:false})}else if(d.type==='trip'){db.trips.unshift({id:uid(),vehicle:String(d.vehicle||''),start:String(d.start||''),end:String(d.end||''),from:String(d.from||''),to:String(d.to||'')})}else throw Error('Неизвестный тип записи');db.received.unshift(new Date().toISOString());save()}function ingest(){try{receive(JSON.parse($('#payload').value));render();$('#status').textContent='Тестовая запись принята'}catch(e){alert(e.message)}}function render(){let v=$('#view');$('#nav').innerHTML=[['home','Главная'],['files','Файлы'],['trips','Поездки'],['settings','Настройки']].map(([p,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${t}</button>`).join('');if(editing){let n=db.notes.find(n=>n.id===editing);v.innerHTML=`<div class="row"><button onclick="editing=null;render()">‹ Назад</button><button onclick="if(confirm('Удалить заметку?')){db.notes=db.notes.filter(n=>n.id!==editing);editing=null;save();render()}">Удалить</button></div><input id="nt" placeholder="Название" value="${esc(n.title)}" oninput="updateNote()"><div class="row"><button onclick="$('#nb').value+='\n- [ ] ';updateNote();$('#nb').focus()">☐ Чекбокс</button></div><textarea id="nb" placeholder="Текст заметки" oninput="updateNote()">${esc(n.body)}</textarea>`;return}if(page==='home'){v.innerHTML=`<div class="muted">${new Date().toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long'})}</div><div class="row"><input id="quick" placeholder="Записать мысль…" onkeydown="if(event.key==='Enter')addTask()"><button class="primary" onclick="addTask()">＋</button></div><div class="section">ИЗБРАННОЕ</div>${db.folders.filter(f=>f.pin).map(folderRow).join('')}${db.notes.filter(n=>n.pin).map(noteRow).join('')||''}<div class="section">БЫСТРЫЕ ЗАПИСИ</div>${tasks()}`}else if(page==='files'){let f=db.folders.find(f=>f.id===folder);v.innerHTML=`<div class="row">${f?`<button onclick="openFolder(${f.parent?`'${f.parent}'`:'null'})">‹</button>`:''}<strong class="grow">${esc(f?.title||'Все файлы')}</strong></div><div class="row"><button onclick="newFolder()">＋ Папка</button><button onclick="newNote()">＋ Заметка</button></div>${db.folders.filter(f=>f.parent===folder).map(folderRow).join('')}${db.notes.filter(n=>n.parent===folder).map(noteRow).join('')}`}else if(page==='trips'){v.innerHTML='<h2>Поездки</h2>'+ (db.trips.map(t=>{let m=Math.round((Date.parse(t.end)-Date.parse(t.start))/60000);return `<div class="item"><div class="grow"><b>${esc(t.vehicle)}</b><p>${esc(t.from)} → ${esc(t.to)}</p><div class="muted">${esc(t.start)} — ${esc(t.end)} ${Number.isFinite(m)&&m>=0?' · '+m+' мин':''}</div></div></div>`}).join('')||'<p class="muted">Нет поездок. Добавь тестовую запись в настройках.</p>')}else{v.innerHTML=`<h2>Данные</h2><div class="row"><button onclick="backup()">Экспорт JSON</button><button onclick="$('#import').click()">Импорт</button><input id="import" type="file" accept=".json" hidden onchange="restore(this.files[0])"></div><h2>Тест автоматизации</h2><p class="muted">Вставь JSON из команды iOS. Это ручной тест формата, не фоновая интеграция.</p><textarea id="payload">{"type":"task","text":"Тест из Команд"}</textarea><button onclick="ingest()">Принять запись</button><p class="muted">Принято: ${db.received.length}</p><p class="muted">v0.1 · ${location.protocol==='https:'?'HTTPS':'Локальный просмотр'}</p>`}}render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
